<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="500" viewBox="0 0 1500 500" role="img" aria-labelledby="t d"><title id="t">How markdown-memory-hermes works</title><desc id="d">Old turns are replaced by compact state and the current turn; completed turns are archived, and context recall retrieves older details.</desc><defs><linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#19142b"/><stop offset="1" stop-color="#34233e"/></linearGradient><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 12 6 0 12z" fill="#ffc274"/></marker></defs><rect width="1500" height="500" rx="26" fill="url(#b)"/><text x="70" y="70" fill="#ffd087" font-family="Arial" font-size="22" font-weight="700" letter-spacing="3">SELECT · RECORD · RECALL</text><g font-family="Arial"><g fill="#292340" stroke="#856894" stroke-width="2"><rect x="70" y="130" width="280" height="115" rx="18"/><rect x="450" y="130" width="280" height="115" rx="18"/><rect x="830" y="130" width="250" height="115" rx="18"/></g><rect x="450" y="345" width="280" height="100" rx="18" fill="#292340" stroke="#856894" stroke-width="2"/><rect x="900" y="345" width="250" height="100" rx="18" fill="#292340" stroke="#d88d67" stroke-width="2"/><rect x="1200" y="345" width="230" height="100" rx="18" fill="#44344d" stroke="#b8916f" stroke-width="2"/><g fill="#fff8f2" font-size="22" font-weight="700"><text x="105" y="180">Native transcript</text><text x="486" y="180">select_context</text><text x="871" y="180">Model request</text><text x="494" y="395">on_turn_complete</text><text x="945" y="395">transcript.md</text><text x="1234" y="395">context_recall</text></g><g fill="#d3c4d7" font-size="17"><text x="105" y="218">full conversation</text><text x="486" y="218">state + current turn</text><text x="871" y="218">bounded replay</text><text x="494" y="426">append + roll state</text><text x="945" y="426">append-only archive</text><text x="1234" y="426">retrieve on demand</text></g><path d="M350 187h90m290 0h85M590 245v88m140 50h150m250 0h35" fill="none" stroke="#ffc274" stroke-width="3" marker-end="url(#a)"/><text x="830" y="300" fill="#c4b5ce" font-size="17">Native session database is read-only.</text></g></svg>
