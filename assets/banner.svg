<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-labelledby="t d"><title id="t">markdown-memory-hermes — bounded request context</title><desc id="d">Long conversation history is archived while compact working state and the current turn are sent to the model.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#19142b"/><stop offset="1" stop-color="#34233e"/></linearGradient></defs><rect width="1600" height="560" rx="32" fill="url(#bg)"/><circle cx="1310" cy="230" r="190" fill="#d87953" opacity=".14"/><text x="100" y="150" fill="#ffd087" font-family="Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="5">HERMES AGENT · CONTEXT ENGINE</text><text x="100" y="250" fill="#fff8f2" font-family="Arial,sans-serif" font-size="72" font-weight="700">Keep the work.</text><text x="100" y="332" fill="#fff8f2" font-family="Arial,sans-serif" font-size="72" font-weight="700">Bound the replay.</text><text x="104" y="400" fill="#d6c9d7" font-family="Arial,sans-serif" font-size="26">Compact state in each request. Full turns in a searchable archive.</text><g transform="translate(1080 105)" font-family="monospace"><rect width="360" height="340" rx="24" fill="#211d36" stroke="#775d83" stroke-width="2"/><text x="35" y="55" fill="#c9b8d2" font-size="17">conversation</text><g stroke="#806e89" stroke-width="8" stroke-linecap="round"><path d="M38 90h270M38 120h230M38 150h250"/></g><path d="M178 177v35m-10-9 10 12 10-12" fill="none" stroke="#ffbd69" stroke-width="4"/><rect x="35" y="229" width="290" height="73" rx="14" fill="#44344d"/><text x="54" y="260" fill="#ffe5bc" font-size="16">state.md + current turn</text><text x="54" y="284" fill="#c9b8d2" font-size="14">request context</text><text x="35" y="327" fill="#d98b6b" font-size="14">transcript.md stays recoverable</text></g></svg>
